<html>

<head>
  <script type="module">
    // Keycloak 26 no longer serves the adapter from `/js/keycloak.js` - it is a
    // standalone, ESM-only library now (`npm install keycloak-js`). Loaded from a
    // CDN here to keep the demo a plain static page.
    import Keycloak from 'https://cdn.jsdelivr.net/npm/keycloak-js@26.2.4/lib/keycloak.js';

    const keycloak = new Keycloak({
      url: 'http://localhost:5080/',
      realm: 'master',
      clientId: 'dest-app'
    });

    const authenticated = await keycloak.init({
      onLoad: 'login-required',
      checkLoginIframe: false,
    });
    alert(authenticated ? 'authenticated' : 'not authenticated');

    document.getElementById('logout').addEventListener('click', function (event) {
      event.preventDefault();
      // Keycloak 18+ requires `id_token_hint` / `post_logout_redirect_uri` for
      // RP initiated logout - keycloak.js adds those for us
      keycloak.logout({ redirectUri: 'http://localhost:5081/' });
    });
  </script>
</head>

<body>
  <h1>Showing "hidden" contents only after successful login</h1>
  <a href="#" id="logout">Logout</a>
</body>

</html>
